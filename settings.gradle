// Plugin management: Configure repositories and plugin versions
pluginManagement {
    repositories {
        // Gradle plugins repository (should be checked first)
        gradlePluginPortal()
        // Google Android Gradle plugins and Android-specific libraries
        google()
        // Central Maven repository for open-source libraries
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:${requested.version}")
            }
        }
    }
}

// Dependency resolution management: Configure artifact repositories
dependencyResolutionManagement {
    // Fail if project defines repositories (enforces single source of truth)
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Build cache configuration for faster builds
buildCache {
    local {
        enabled = true
    }
}

rootProject.name = "CameraStreamingApp"
include ':app'
